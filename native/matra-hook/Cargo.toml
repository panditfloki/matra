[package]
name = "matra-hook"
version = "0.3.0"
edition = "2021"
description = "Matra hook launcher: report Claude Code hook events, auto-start main app"
license = "MIT"
repository = "https://github.com/panditfloki/matra"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"
] }

[[bin]]
name = "matra-hook"
path = "src/main.rs"
