name: Windows Package

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "scripts/build-native-installer.ps1"
      - ".github/workflows/windows-package.yml"
  pull_request:
    paths:
      - "native/**"
      - "scripts/build-native-installer.ps1"
      - ".github/workflows/windows-package.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag to receive Matra-Setup.exe"
        required: false
        type: string

jobs:
  package:
    if: github.repository == 'panditfloki/matra' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-on-failure: true
      - name: Test UI scripts and preference contracts
        run: |
          $scripts = @('scripts/check-ui-scripts.mjs', 'scripts/test-claude-auth-ui.cjs', 'scripts/test-ko-i18n.cjs', 'scripts/test-matra-copy.cjs', 'scripts/test-matra-interactions.cjs', 'scripts/test-matra-appearance.cjs', 'scripts/test-matra-quota.cjs', 'test-codex-headline.cjs')
          foreach ($script in $scripts) {
            node $script
            if ($LASTEXITCODE -ne 0) { throw "UI regression failed: $script" }
          }
      - name: Test native Windows code
        run: cargo test --release --locked
      - name: Build the hook
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p matra-hook --target-dir target/hook
      - name: Build the installer
        working-directory: native/matra
        run: npx --yes @tauri-apps/cli@2.11.4 build --config tauri.bundle.conf.json -- --locked
      - name: Give the installer a stable name
        run: |
          $setup = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw "Expected one installer, found $($setup.Count)." }
          Copy-Item $setup[0].FullName Matra-Setup.exe
      - name: Download verified public upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.8.4 --repo panditfloki/matra --pattern Matra-Setup.exe --pattern SHA256SUMS.txt --dir target/baseline
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the public upgrade baseline.' }
          $expected = ((Get-Content target/baseline/SHA256SUMS.txt | Where-Object { $_ -match 'Matra-Setup.exe$' }) -split '\s+')[0]
          if ($expected -notmatch '^[0-9a-fA-F]{64}$') { throw 'Invalid baseline checksum file.' }
          if ((Get-FileHash target/baseline/Matra-Setup.exe -Algorithm SHA256).Hash -ne $expected) { throw 'Baseline checksum mismatch.' }
      - name: Fresh install, real WebView2, upgrade and uninstall
        run: ../scripts/test-windows-installer.ps1 -Installer (Resolve-Path Matra-Setup.exe) -PreviousInstaller (Resolve-Path target/baseline/Matra-Setup.exe)
      - name: Checksum the tested installer
        run: |
          $hash = (Get-FileHash Matra-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Matra-Setup.exe" | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Matra-Windows-evidence-${{ github.sha }}
          path: |
            .desktop-test/windows-185-*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: Matra-Setup-${{ github.sha }}
          path: |
            native/Matra-Setup.exe
            native/SHA256SUMS.txt
          if-no-files-found: error
      - name: Attach installer to release
        if: >-
          (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) ||
          (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          # A locally verified setup can already be attached before publication.
          # Never silently replace it with a second build of the same release.
          $release = gh release view $env:TAG --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read release assets.' }
          if ($release.assets.name -contains 'Matra-Setup.exe') {
            Write-Output 'Installer already attached; preserving the published binary.'
          } else {
            gh release upload $env:TAG Matra-Setup.exe SHA256SUMS.txt
            if ($LASTEXITCODE -ne 0) { throw 'Installer upload failed.' }
          }
