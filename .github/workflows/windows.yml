name: Windows

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "shared/notch-reference/**"
      - "scripts/check-mac-notch-reference.mjs"
      - "scripts/build-native-installer.ps1"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "native/**"
      - "shared/notch-reference/**"
      - "scripts/check-mac-notch-reference.mjs"
      - "scripts/build-native-installer.ps1"
      - ".github/workflows/windows.yml"

jobs:
  test:
    if: github.repository == 'panditfloki/matra'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - name: Check Mac reference and Windows adapter
        run: node ../scripts/check-mac-notch-reference.mjs --check --self-test --runtime
      - name: Test Mac notch geometry in Windows adapter
        run: node scripts/test-mac-notch.cjs
      - name: Parse UI scripts
        run: node scripts/check-ui-scripts.mjs
      - name: Test Claude authentication UI
        run: node scripts/test-claude-auth-ui.cjs
      - name: Test localization
        run: node --test scripts/test-ko-i18n.cjs
      - name: Test Matra product copy
        run: node scripts/test-matra-copy.cjs
      - name: Test motion and update states
        run: node scripts/test-matra-interactions.cjs
      - name: Test appearance and preference persistence
        run: node scripts/test-matra-appearance.cjs
      - name: Test quota controls and boundary colours
        run: node --test scripts/test-matra-quota.cjs
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Test Codex headline selection
        run: node --test test-codex-headline.cjs
      - name: Clippy report
        continue-on-error: true
        run: cargo clippy --all-targets --locked
